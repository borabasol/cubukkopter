<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Çubukkopter</title>
<meta name="description" content="Çubuğuna tutunularak uçulan tek kişilik kopterin etkileşimli 3D konsepti.">
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#18262b;--paint:#e4572e;--sky:#b9d0d6;--card:#f4efe4}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font:500 15px/1.35 Barlow,system-ui,sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;left:clamp(16px,3vw,40px);top:clamp(14px,3vw,32px);pointer-events:none}
h1{font:800 clamp(40px,7vw,92px)/.94 "Big Shoulders Display",Impact,sans-serif;margin:0;letter-spacing:-.01em}
header p{margin:10px 0 0;max-width:27ch}
.specs{position:fixed;right:clamp(16px,3vw,40px);top:clamp(18px,3vw,36px);margin:0;text-align:right;font-variant-numeric:tabular-nums}
.specs div{display:flex;gap:14px;justify-content:flex-end;padding:3px 0}.specs dt{opacity:.7}.specs dd{margin:0;min-width:74px;font-weight:600}
.bar{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:18px;background:var(--card);padding:10px 16px 10px 10px;border-radius:14px;box-shadow:0 8px 30px #1b2f3626;max-width:calc(100vw - 24px)}
button{font:600 15px Barlow,system-ui,sans-serif;color:inherit;border:0;cursor:pointer;background:none;border-radius:9px;min-height:44px}
#engine{background:var(--paint);color:#fff;padding:0 20px;white-space:nowrap;min-width:124px}#engine:hover{filter:brightness(1.07)}
#engine[aria-pressed=true]{background:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
label{display:grid;gap:2px;font-size:13px}input[type=range]{width:118px;accent-color:var(--paint);height:22px;margin:0}
label.ck{display:flex;align-items:center;gap:7px;font-size:15px;white-space:nowrap;min-height:44px}input[type=checkbox]{accent-color:var(--paint);width:18px;height:18px}
.sw{display:flex;gap:2px}.sw button{width:30px;height:44px;min-height:44px;padding:0;display:grid;place-items:center}.sw i{width:22px;height:22px;border-radius:50%;background:var(--k)}.sw [aria-pressed=true] i{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
#hint{position:fixed;left:clamp(16px,3vw,40px);bottom:30px;max-width:24ch;opacity:.8;pointer-events:none}
#stick{position:fixed;right:22px;bottom:190px;width:118px;height:118px;border-radius:50%;background:#f4efe4b0;display:none;touch-action:none}
#stick i{position:absolute;left:37px;top:37px;width:44px;height:44px;border-radius:50%;background:var(--ink)}
body.fly.touch #stick{display:block}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--sky);transition:opacity .4s}#load.x{opacity:0;pointer-events:none}
@media(max-width:820px){.bar{flex-wrap:wrap;justify-content:center;gap:6px 16px;padding:10px 12px;width:calc(100vw - 24px)}.specs{top:18px;right:16px;font-size:14px}.specs div:not(:last-child),header p{display:none}#hint{left:16px;bottom:178px;font-size:13px;max-width:none}input[type=range]{width:104px}}
@media(min-width:821px) and (max-width:1150px){#hint{bottom:100px}}@media(max-height:520px){.specs,header p,#hint{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<canvas id="c" aria-label="Çubukkopter 3D modeli"></canvas>
<header><h1>Çubuk<br>kopter</h1><p>Basamağa çık, gidona tutun, kalk. Tek kişilik uçan çubuk konsepti.</p></header>
<dl class="specs"><div><dt>Yükseklik</dt><dd>3,09 m</dd></div><div><dt>Halka çapı</dt><dd>2,55 m</dd></div><div><dt>Pervane</dt><dd>2 × 3 kanat</dd></div><div><dt>İrtifa</dt><dd id="alt">0,0 m</dd></div></dl>
<div id="hint">Döndürmek için sürükle, yakınlaşmak için kaydır</div>
<div id="stick" aria-hidden="true"><i></i></div>
<div class="bar">
<button id="engine" aria-pressed="false">Havalan</button>
<label>Parçalara ayır<input id="exp" type="range" min="0" max="1" step=".01" value="0"></label>
<label class="ck"><input id="rider" type="checkbox" checked>Sürücü</label>
<div class="sw" role="group" aria-label="Boya rengi"></div>
</div>
<div id="load">Model yükleniyor…</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const $=q=>document.querySelector(q), reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.NeutralToneMapping;R.toneMappingExposure=1;
const S=new THREE.Scene();S.background=new THREE.Color('#b9d0d6');S.fog=new THREE.Fog('#b9d0d6',14,46);
S.environment=new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(),.04).texture;S.environmentIntensity=.8;
const cam=new THREE.PerspectiveCamera(34,1,.05,120);
const O=new OrbitControls(cam,R.domElement);O.enableDamping=true;O.minDistance=.6;O.maxDistance=16;O.maxPolarAngle=Math.PI*.515;O.enablePan=false;
const sun=new THREE.DirectionalLight('#fff3df',2.3);sun.position.set(-4,9,-5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-3,right:3,top:4,bottom:-3,near:1,far:22});sun.shadow.bias=-.0004;sun.shadow.normalBias=.012;sun.shadow.radius=5;S.add(sun,sun.target);
S.add(new THREE.HemisphereLight('#dceef5','#8f9f8e',.45));
const floor=new THREE.Mesh(new THREE.CircleGeometry(70,64),new THREE.MeshStandardMaterial({color:'#8fb0b7',roughness:1,envMapIntensity:.2}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;S.add(floor);
// inis pisti
const pad=new THREE.Group(),pm=c=>new THREE.MeshStandardMaterial({color:c,roughness:1,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
[[1.50,1.60],[.60,.64]].forEach(([a,b])=>{const m=new THREE.Mesh(new THREE.RingGeometry(a,b,96),pm('#f4efe4'));m.rotation.x=-Math.PI/2;m.position.y=.002;m.receiveShadow=true;pad.add(m)});
for(let i=0;i<24;i++){const a=i/24*Math.PI*2,m=new THREE.Mesh(new THREE.PlaneGeometry(.05,i%6?.12:.34),pm('#f4efe4'));m.rotation.set(-Math.PI/2,0,-a);const r=i%6?1.72:1.83;m.position.set(Math.sin(a)*r,.002,Math.cos(a)*r);m.receiveShadow=true;pad.add(m)}
S.add(pad);
// ucusta yon duygusu veren isaret direkleri
const poles=new THREE.InstancedMesh(new THREE.CylinderGeometry(.035,.05,1.6,10),new THREE.MeshStandardMaterial({color:'#f4efe4',roughness:.8}),28);
const caps=new THREE.InstancedMesh(new THREE.SphereGeometry(.11,16,12),new THREE.MeshStandardMaterial({color:'#e4572e',roughness:.6}),28);
for(let i=0;i<28;i++){const a=i*2.39996,r=6+i*.62,h=.7+(i*37%10)/9,M=new THREE.Matrix4();M.makeScale(1,h,1).setPosition(Math.cos(a)*r,.8*h,Math.sin(a)*r);poles.setMatrixAt(i,M);caps.setMatrixAt(i,new THREE.Matrix4().makeTranslation(Math.cos(a)*r,1.6*h,Math.sin(a)*r))}
S.add(poles,caps);

const N={},base={},craft=new THREE.Group(),head=new THREE.Group(),PIV=2.40;S.add(craft);
let paint,blur=[],lamp;
new GLTFLoader().load('model/cubukkopter.glb',g=>{
  g.scene.traverse(o=>{N[o.name]=o;if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material.name==='Paint')paint=o.material;}});
  craft.add(g.scene);head.position.y=PIV;N.Cubukkopter.add(head);
  for(const k of['Pod','Ring','RotorLower','RotorUpper']){head.add(N[k]);N[k].position.y-=PIV}
  for(const k of['Foot','Pegs','Mast','Handlebar','Gimbal','Pod','Ring','RotorLower','RotorUpper'])base[k]=N[k].position.y;
  for(const k of['RotorLower','RotorUpper']){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),gr=x.createRadialGradient(128,128,10,128,128,127);
    gr.addColorStop(0,'rgba(24,30,34,.5)');gr.addColorStop(.84,'rgba(24,30,34,.2)');gr.addColorStop(.86,'rgba(228,87,46,.4)');gr.addColorStop(.985,'rgba(228,87,46,.4)');gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.fillRect(0,0,256,256);
    const m=new THREE.Mesh(new THREE.CircleGeometry(1.165,72),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.copy(N[k].position);head.add(m);m.userData.k=k;blur.push(m)}
  setColor(0);$('#load').classList.add('x');resize();home();
},undefined,()=>{$('#load').textContent='Model yüklenemedi. Sayfayı yenileyip tekrar dene.'});

const cols=[['Turuncu','#e4572e'],['Mavi','#1f6fb2'],['Yeşil','#2f8f5b'],['Sarı','#e8b021']];
cols.forEach(([n,c],i)=>{const b=document.createElement('button');b.title=n;b.setAttribute('aria-label',n);b.style.setProperty('--k',c);b.innerHTML='<i></i>';b.onclick=()=>setColor(i);$('.sw').append(b)});
function setColor(i){paint?.color.set(cols[i][1]);caps.material.color.set(cols[i][1]);document.documentElement.style.setProperty('--paint',cols[i][1]);[...$('.sw').children].forEach((b,j)=>b.setAttribute('aria-pressed',i===j));
  blur.forEach(m=>{const x=m.material.map.image.getContext('2d'),gr=x.createRadialGradient(128,128,10,128,128,127);x.clearRect(0,0,256,256);gr.addColorStop(0,'rgba(24,30,34,.5)');gr.addColorStop(.855,'rgba(24,30,34,.2)');gr.addColorStop(.86,cols[i][1]+'66');gr.addColorStop(.985,cols[i][1]+'66');gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.fillRect(0,0,256,256);m.material.map.needsUpdate=true})}
let on=false,rpm=0,y=0,vy=0,exp=0,expT=0;const v=new THREE.Vector2(),tilt=new THREE.Vector2(),key={},stick=new THREE.Vector2();
$('#engine').onclick=()=>{on=!on;if(on){expT=0;$('#exp').value=0}$('#engine').textContent=on?'İniş yap':'Havalan';$('#engine').setAttribute('aria-pressed',on);document.body.classList.toggle('fly',on);hint()};
function hint(){$('#hint').textContent=on?(document.body.classList.contains('touch')?'Yön için sağdaki topuzu kullan':'Ok tuşlarıyla ya da WASD ile uç, boşlukla yüksel, Shift ile alçal'):'Döndürmek için sürükle, yakınlaşmak için kaydır'}
$('#exp').oninput=e=>{expT=+e.target.value;if(expT>0&&on)$('#engine').click()};
$('#rider').onchange=e=>{if(N.Rider)N.Rider.visible=e.target.checked};
addEventListener('keydown',e=>{if(/^(Arrow|Space)/.test(e.code)&&on&&e.target.type!=='range'){e.preventDefault();if(document.activeElement?.blur)document.activeElement.blur()}key[e.code]=1});addEventListener('keyup',e=>key[e.code]=0);addEventListener('blur',()=>{for(const k in key)key[k]=0});
addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){document.body.classList.add('touch');hint()}},{passive:true});
const st=$('#stick');const mv=e=>{const r=st.getBoundingClientRect();stick.set(e.clientX-r.left-59,e.clientY-r.top-59).divideScalar(50);if(stick.length()>1)stick.normalize();st.firstElementChild.style.transform=`translate(${stick.x*36}px,${stick.y*36}px)`};
st.onpointerdown=e=>{st.setPointerCapture(e.pointerId);mv(e)};st.onpointermove=e=>{if(st.hasPointerCapture(e.pointerId))mv(e)};st.onpointerup=st.onpointercancel=()=>{stick.set(0,0);st.firstElementChild.style.transform=''};
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<.8?50:36;const sh=Math.round(innerHeight*(cam.aspect<.8?.055:.06));cam.setViewOffset(innerWidth,innerHeight,0,sh,innerWidth,innerHeight);cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function home(){const p=cam.aspect<.8;O.target.set(0,p?1.35:1.5,0);cam.position.set(p?4.0:4.1,p?2.1:2.0,p?-6.1:-5.5);O.update()}home();
let targetY=1.8,last=performance.now(),prev=new THREE.Vector3();const tmp=new THREE.Vector3(),f=new THREE.Vector3(),rt=new THREE.Vector3(),cnt=new THREE.Vector3();
function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  rpm+=((on||y>.02?1:0)-rpm)*(1-Math.exp(-dt*(on?1.5:1.1)));
  if(N.Rider){
    let ix=(key.ArrowRight||key.KeyD?1:0)-(key.ArrowLeft||key.KeyA?1:0)+stick.x, iy=(key.ArrowUp||key.KeyW?1:0)-(key.ArrowDown||key.KeyS?1:0)-stick.y;
    if(on)targetY=THREE.MathUtils.clamp(targetY+((key.Space?1:0)-(key.ShiftLeft||key.ShiftRight?1:0))*dt*1.8,.5,9);else targetY=1.8;
    const aim=on&&rpm>.75?targetY+(reduce?0:Math.sin(t/900)*.05):0;
    const a=THREE.MathUtils.clamp((aim-y)*2.2-vy*2.6,-3,2.4);vy+=a*dt;if(!on)vy=Math.max(vy,-.28-y*.35);y+=vy*dt;if(y<0){y=0;vy=0}
    // kamera yonune gore hareket
    cam.getWorldDirection(f);f.y=0;f.normalize();rt.set(-f.z,0,f.x);
    const air=y>.25&&on?1:0,ax=(rt.x*ix+f.x*iy)*air,az=(rt.z*ix+f.z*iy)*air;
    const lim=.2;tilt.x+=((ax*lim-v.x*.012)-tilt.x)*(1-Math.exp(-dt*5));tilt.y+=((az*lim-v.y*.012)-tilt.y)*(1-Math.exp(-dt*5));
    v.x+=(ax*5.2-v.x*1.15)*dt;v.y+=(az*5.2-v.y*1.15)*dt;if(y<.02)v.set(0,0);
    craft.position.x+=v.x*dt;craft.position.z+=v.y*dt;craft.position.y=y;
    const d=Math.hypot(craft.position.x,craft.position.z);if(d>26){craft.position.x*=26/d;craft.position.z*=26/d}
    // kafa one egilir, direk geriden sarkac gibi takip eder
    head.rotation.set(tilt.y,0,-tilt.x);N.Gimbal.rotation.set(tilt.y*.5,0,-tilt.x*.5);
    const sw=reduce?0:Math.sin(t/1300)*.012*rpm*Math.min(1,y);
    craft.rotation.set(v.y*.030+sw,0,-v.x*.030-sw*.6);
    // ayirma gorunumu
    exp+=(expT-exp)*(1-Math.exp(-dt*9));const E={Foot:0,Pegs:.22,Mast:.30,Handlebar:.50,Gimbal:.62,Pod:.80,RotorLower:1.02,Ring:1.34,RotorUpper:1.62};
    for(const k in E)N[k].position.y=base[k]+E[k]*exp;
    blur.forEach(m=>{m.position.y=N[m.userData.k].position.y;m.material.opacity=THREE.MathUtils.smoothstep(rpm,.45,.95)});
    N.Rider.position.set(0,-.44*exp,1.1*exp);
    const w=rpm*rpm*31;N.RotorLower.rotation.y+=w*dt;N.RotorUpper.rotation.y-=w*dt;
    const hide=rpm>.9;for(const k of['RotorLower','RotorUpper'])N[k].traverse(o=>{if(o.isMesh&&/Carbon|Paint/.test(o.name))o.visible=!hide});
    const want=tmp.set(craft.position.x,craft.position.y,craft.position.z),dlt=want.clone().sub(prev);prev.copy(want);
    const ey=.72*(exp-(frame.e||0));frame.e=exp;O.target.add(dlt);cam.position.add(dlt);O.target.y+=ey;cam.position.y+=ey;if(ey>0){cnt.copy(cam.position).sub(O.target);cam.position.copy(O.target).add(cnt.multiplyScalar(1+ey*.45))}
    sun.position.set(craft.position.x-4,9+y,craft.position.z-5);sun.target.position.set(craft.position.x,y*.5+1,craft.position.z);sun.shadow.camera.top=4+y*.6;sun.shadow.camera.bottom=-3-y*.6;sun.shadow.camera.updateProjectionMatrix();
    $('#alt').textContent=y.toFixed(1).replace('.',',')+' m';
  }
  O.update();R.render(S,cam);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
